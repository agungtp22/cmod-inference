[package]
name = "cmod-inference"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
description = "Standalone multi-GPU Local Document Intelligence inference gateway & supervisor for cmod with native OpenAI and Anthropic APIs"
license = "MIT"

[[bin]]
name = "cmod-inference"
path = "src/main.rs"

[lib]
name = "cmod_inference"
path = "src/lib.rs"

[features]
default = []
native = ["dep:llama-cpp-2"]
grammar = ["native", "llama-cpp-2/llguidance", "dep:llguidance", "dep:toktrie"]
multimodal = ["native", "llama-cpp-2/mtmd"]
metal = ["native", "grammar", "llama-cpp-2/metal"]
cuda = ["native", "grammar", "llama-cpp-2/cuda"]
rocm = ["native", "grammar", "llama-cpp-2/rocm"]
vulkan = ["native", "grammar", "llama-cpp-2/vulkan"]

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8", features = ["json"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
llama-cpp-2 = { version = "0.1.161", optional = true }
llguidance = { version = "1.7.5", optional = true }
toktrie = { version = "1.7.5", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.38"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "signal", "net"] }
tokio-stream = "0.1"
tokio-util = "0.7"
toml = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
