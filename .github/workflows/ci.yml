name: CI & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64 (Native CPU + Grammar + Multimodal)
            os: ubuntu-latest
            features: "native grammar multimodal"
            artifact: cmod-inference-linux-x86_64
            bin_name: cmod-inference
          - label: macOS ARM64 (Native Metal + Multimodal)
            os: macos-15
            features: "metal multimodal"
            artifact: cmod-inference-macos-arm64
            bin_name: cmod-inference
          - label: Windows x86_64 (Native CPU + Grammar + Multimodal)
            os: windows-latest
            features: "native grammar multimodal"
            artifact: cmod-inference-windows-x86_64
            bin_name: cmod-inference.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libclang-dev cmake ninja-build

      - name: Configure LLVM/Clang for Windows bindgen
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files\LLVM\bin\libclang.dll") {
            "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            choco install llvm -y --no-progress
            "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Verify macOS runner is ARM64
        if: runner.os == 'macOS'
        run: |
          ARCH=$(uname -m)
          echo "Detected macOS arch: $ARCH"
          test "$ARCH" = "arm64"

      - name: Run unit & conformance tests
        run: cargo test --features "${{ matrix.features }}"

      - name: Build release binary
        run: cargo build --release --features "${{ matrix.features }}"

      - name: Package Linux (.deb + .tar.gz)
        if: runner.os == 'Linux'
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -n1 | cut -d'"' -f2)
          mkdir -p dist
          # 1. Debian (.deb) installer
          PKG_DIR="target/deb/cmod-inference_${VERSION}_amd64"
          mkdir -p "${PKG_DIR}/DEBIAN" "${PKG_DIR}/usr/bin" "${PKG_DIR}/usr/share/doc/cmod-inference"
          install -m 755 target/release/cmod-inference "${PKG_DIR}/usr/bin/cmod-inference"
          ln -sf cmod-inference "${PKG_DIR}/usr/bin/cmod"
          install -m 644 README.md "${PKG_DIR}/usr/share/doc/cmod-inference/README.md"
          INSTALLED_SIZE=$(du -sk "${PKG_DIR}/usr" | cut -f1)
          cat > "${PKG_DIR}/DEBIAN/control" <<EOF
          Package: cmod-inference
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Installed-Size: ${INSTALLED_SIZE}
          Depends: libc6, libstdc++6, libgomp1
          Maintainer: Agung Tri Pambudi <https://github.com/agungtp22/cmod-inference>
          Description: Standalone local AI inference server (OpenAI + Anthropic + 3-Tier KV-Cache)
           Single-binary Rust AI inference server with in-process llama.cpp,
           llguidance constrained JSON decoding, 3-Tier KV-Cache, GGUF security
           scanner, and embedded cmod Studio Web GUI.
          EOF
          dpkg-deb --build --root-owner-group "${PKG_DIR}"
          cp "target/deb/cmod-inference_${VERSION}_amd64.deb" dist/
          # 2. Tarball
          tar -czf "dist/cmod-inference-linux-x86_64.tar.gz" -C target/release cmod-inference
          ls -lh dist/

      - name: Package macOS ARM64 (.tar.gz)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          tar -czf "dist/cmod-inference-macos-arm64.tar.gz" -C target/release cmod-inference
          ls -lh dist/

      - name: Package Windows x86_64 (.zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path target/release/cmod-inference.exe -DestinationPath dist/cmod-inference-windows-x86_64.zip -Force
          Get-ChildItem dist/

      - name: Upload release package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "${TAG}" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release-assets/* -R "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${TAG}" release-assets/* \
              -R "${GITHUB_REPOSITORY}" \
              --title "cmod-inference ${TAG}" \
              --generate-notes
          fi
