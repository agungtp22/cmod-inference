name: CI & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64 CPU (Native + Grammar + Multimodal)
            os: ubuntu-latest
            features: "native grammar multimodal"
            artifact: cmod-inference-linux-x86_64
            bin_name: cmod-inference
            accel: cpu
          - label: Linux x86_64 CUDA (NVIDIA T4/L4/A100/H100/RTX)
            os: ubuntu-latest
            features: "cuda multimodal"
            artifact: cmod-inference-linux-x86_64-cuda
            bin_name: cmod-inference
            accel: cuda
          - label: Linux x86_64 ROCm (AMD Radeon/Instinct HIP)
            os: ubuntu-latest
            features: "rocm multimodal"
            artifact: cmod-inference-linux-x86_64-rocm
            bin_name: cmod-inference
            accel: rocm
          - label: Linux x86_64 Vulkan (Cross-Vendor AMD/Intel/NVIDIA)
            os: ubuntu-latest
            features: "vulkan multimodal"
            artifact: cmod-inference-linux-x86_64-vulkan
            bin_name: cmod-inference
            accel: vulkan
          - label: macOS ARM64 (Native Metal + Multimodal)
            os: macos-15
            features: "metal multimodal"
            artifact: cmod-inference-macos-arm64
            bin_name: cmod-inference
            accel: metal
          - label: Windows x86_64 (Native CPU + Grammar + Multimodal)
            os: windows-latest
            features: "native grammar multimodal"
            artifact: cmod-inference-windows-x86_64
            bin_name: cmod-inference.exe
            accel: cpu

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux base build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libclang-dev cmake ninja-build

      - name: Install NVIDIA CUDA Toolkit (minimal nvcc + cublas)
        if: runner.os == 'Linux' && matrix.accel == 'cuda'
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cuda-nvcc-12-8 cuda-cudart-dev-12-8 libcublas-dev-12-8
          echo "/usr/local/cuda-12.8/bin" >> "$GITHUB_PATH"
          echo "CUDA_PATH=/usr/local/cuda-12.8" >> "$GITHUB_ENV"
          echo "CUDAToolkit_ROOT=/usr/local/cuda-12.8" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=/usr/local/cuda-12.8/lib64/stubs:/usr/local/cuda-12.8/lib64" >> "$GITHUB_ENV"
          echo "CMAKE_CUDA_ARCHITECTURES=75;80;86;89;90" >> "$GITHUB_ENV"
          /usr/local/cuda-12.8/bin/nvcc --version

      - name: Install AMD ROCm / HIP build dependencies
        if: runner.os == 'Linux' && matrix.accel == 'rocm'
        run: |
          sudo apt-get install -y --no-install-recommends hipcc libhipblas-dev librocblas-dev
          echo "HIP_PATH=/usr" >> "$GITHUB_ENV"
          echo "AMDGPU_TARGETS=gfx1030;gfx1100;gfx1101;gfx90a;gfx942" >> "$GITHUB_ENV"
          hipcc --version

      - name: Install Vulkan build dependencies
        if: runner.os == 'Linux' && matrix.accel == 'vulkan'
        run: |
          sudo apt-get install -y --no-install-recommends libvulkan-dev glslc spirv-headers glslang-dev
          glslc --version

      - name: Configure LLVM/Clang for Windows bindgen
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files\LLVM\bin\libclang.dll") {
            "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            choco install llvm -y --no-progress
            "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Verify macOS runner is ARM64
        if: runner.os == 'macOS'
        run: |
          ARCH=$(uname -m)
          echo "Detected macOS arch: $ARCH"
          test "$ARCH" = "arm64"

      - name: Run unit & conformance tests
        if: matrix.accel == 'cpu' || matrix.accel == 'metal'
        run: cargo test --features "${{ matrix.features }}"

      - name: Compile tests (GPU backend on GPU-less runner)
        if: matrix.accel == 'cuda' || matrix.accel == 'rocm' || matrix.accel == 'vulkan'
        run: cargo test --no-run --features "${{ matrix.features }}"

      - name: Build release binary
        run: cargo build --release --features "${{ matrix.features }}"

      - name: Package Linux (.deb + .tar.gz)
        if: runner.os == 'Linux'
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -n1 | cut -d'"' -f2)
          mkdir -p dist
          case "${{ matrix.accel }}" in
            cuda)
              DEB_PREFIX="cmod-inference-cuda"
              TAR_NAME="cmod-inference-linux-x86_64-cuda.tar.gz"
              DESC_SUFFIX=" (NVIDIA CUDA 12.8: T4/L4/A100/H100/RTX)"
              EXTRA_DEPS=""
              ;;
            rocm)
              DEB_PREFIX="cmod-inference-rocm"
              TAR_NAME="cmod-inference-linux-x86_64-rocm.tar.gz"
              DESC_SUFFIX=" (AMD ROCm HIP: Radeon RX 6000/7000 & Instinct)"
              EXTRA_DEPS=""
              ;;
            vulkan)
              DEB_PREFIX="cmod-inference-vulkan"
              TAR_NAME="cmod-inference-linux-x86_64-vulkan.tar.gz"
              DESC_SUFFIX=" (Cross-Vendor Vulkan GPU: AMD/Intel/NVIDIA)"
              EXTRA_DEPS=", libvulkan1"
              ;;
            *)
              DEB_PREFIX="cmod-inference"
              TAR_NAME="cmod-inference-linux-x86_64.tar.gz"
              DESC_SUFFIX=""
              EXTRA_DEPS=""
              ;;
          esac
          # 1. Debian (.deb) installer
          PKG_DIR="target/deb/${DEB_PREFIX}_${VERSION}_amd64"
          mkdir -p "${PKG_DIR}/DEBIAN" "${PKG_DIR}/usr/bin" "${PKG_DIR}/usr/share/doc/cmod-inference"
          install -m 755 target/release/cmod-inference "${PKG_DIR}/usr/bin/cmod-inference"
          ln -sf cmod-inference "${PKG_DIR}/usr/bin/cmod"
          install -m 644 README.md "${PKG_DIR}/usr/share/doc/cmod-inference/README.md"
          INSTALLED_SIZE=$(du -sk "${PKG_DIR}/usr" | cut -f1)
          cat > "${PKG_DIR}/DEBIAN/control" <<EOF
          Package: cmod-inference
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Installed-Size: ${INSTALLED_SIZE}
          Depends: libc6, libstdc++6, libgomp1${EXTRA_DEPS}
          Maintainer: Agung Tri Pambudi <https://github.com/agungtp22/cmod-inference>
          Description: Standalone local AI inference server${DESC_SUFFIX}
           Single-binary Rust AI inference server with in-process llama.cpp,
           llguidance constrained JSON decoding, 3-Tier KV-Cache, GGUF security
           scanner, and embedded cmod Studio Web GUI.
          EOF
          dpkg-deb --build --root-owner-group "${PKG_DIR}"
          cp "target/deb/${DEB_PREFIX}_${VERSION}_amd64.deb" dist/
          # 2. Tarball
          tar -czf "dist/${TAR_NAME}" -C target/release cmod-inference
          ls -lh dist/

      - name: Package macOS ARM64 (.tar.gz)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          tar -czf "dist/cmod-inference-macos-arm64.tar.gz" -C target/release cmod-inference
          ls -lh dist/

      - name: Package Windows x86_64 (.zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path target/release/cmod-inference.exe -DestinationPath dist/cmod-inference-windows-x86_64.zip -Force
          Get-ChildItem dist/

      - name: Upload release package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "${TAG}" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release-assets/* -R "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${TAG}" release-assets/* \
              -R "${GITHUB_REPOSITORY}" \
              --title "cmod-inference ${TAG}" \
              --generate-notes
          fi
